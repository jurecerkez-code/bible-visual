let W=innerWidth,H=innerHeight;cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;cv.style.width=W+'px';cv.style.height=H+'px';ctx.scale(devicePixelRatio,devicePixelRatio);
const N=G.nodes,IDX={};N.forEach((n,i)=>IDX[n.id]=i);
const col={book:'#7a5ac0',person:'#c9607e',place:'#3a9a86',theme:'#b08d3f'};
const nodeR=n=>n.g==='book'?4+Math.sqrt(n.w)/6:3+Math.sqrt(n.w)/2.2;
// static precomputed layout — no runtime physics
let minX=Math.min(...N.map(n=>n.x)),maxX=Math.max(...N.map(n=>n.x)),minY=Math.min(...N.map(n=>n.y)),maxY=Math.max(...N.map(n=>n.y));
const gw=maxX-minX,gh=maxY-minY;let scale=Math.min((W-30)/(gw+60),(H*0.62)/(gh+60));scale=Math.max(scale,0.1);
let ox=W/2-(minX+maxX)/2*scale, oy=H/2-(minY+maxY)/2*scale;
const E=G.edges.map(e=>({a:IDX[e[0]],b:IDX[e[1]],w:e[2]}));
let sel=null,hl=new Set(),hlE=new Set();
function draw(){ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.clearRect(0,0,W,H);
ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);
for(const e of E){const A=N[e.a],B=N[e.b];const on=!sel||hl.has(e.a)||hl.has(e.b);
ctx.strokeStyle=on?(sel?'rgba(201,185,136,.5)':'rgba(74,64,110,.35)'):'rgba(74,64,110,.07)';
ctx.lineWidth=on?Math.max(.5,e.w*.35):.3;ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke()}
for(const n of N){const i=IDX[n.id];const on=!sel||hl.has(i);
ctx.globalAlpha=on?1:.15;ctx.fillStyle=col[n.g];ctx.beginPath();ctx.arc(n.x,n.y,nodeR(n),0,7);ctx.fill();
if(sel===i){ctx.strokeStyle='#c9b988';ctx.lineWidth=2;ctx.stroke()}
if(on&&(n.g==='book'||hl.has(i)||sel===i||scale>1.4)){ctx.globalAlpha=on?.9:.15;ctx.fillStyle='#9a92b8';ctx.font=(n.g==='book'?11:10)+'px Georgia';ctx.textAlign='center';ctx.fillText(n.label,n.x,n.y-nodeR(n)-3)}}
ctx.restore();ctx.globalAlpha=1}
function toWorld(px,py){return[(px-ox)/scale,(py-oy)/scale]}
function hit(px,py){const[wx,wy]=toWorld(px,py);let best=null,bd=18;
for(let i=0;i<N.length;i++){const n=N[i];const d=Math.hypot(n.x-wx,n.y-wy)-nodeR(n);if(d<bd){bd=d;best=i}}return best}
function open(i){sel=i;const n=N[i];hl=new Set([i]);hlE.clear();
for(const e of E){if(e.a===i)hl.add(e.b);if(e.b===i)hl.add(e.a)}
// backlinks/forward links from nb
const nbs=G.nb[n.id]||[];
document.getElementById('pb').innerHTML=`<div class="g">${n.g} · ${(nbs.length)} links</div><h3>${n.label}</h3>
<div class="lab">connected to</div><div>${nbs.map(b=>{const m=N[IDX[b]];return `<a class="bk" onclick="jump('${b.replace(/'/g,"")}')">${m.label}</a>`}).join('')}</div>`;
document.getElementById('panel').classList.add('on');draw()}
window.jump=id=>{open(IDX[id]);const n=N[IDX[id]];const[wx,wy]=toWorld(W/2,H/2);ox+=wx-n.x;oy+=wy-n.y;draw()};
document.getElementById('x').onclick=()=>{document.getElementById('panel').classList.remove('on');sel=null;hl.clear();draw()};
// pointer: tap vs drag
let pdown=null,moved=false;
cv.addEventListener('pointerdown',e=>{pdown=[e.clientX,e.clientY,ox,oy];moved=false});
cv.addEventListener('pointermove',e=>{if(!pdown)return;const dx=e.clientX-pdown[0],dy=e.clientY-pdown[1];if(Math.abs(dx)+Math.abs(dy)>6)moved=true;if(moved){ox=pdown[2]+dx;oy=pdown[3]+dy;draw()}});
cv.addEventListener('pointerup',e=>{if(pdown&&!moved){const i=hit(e.clientX,e.clientY);if(i!=null)open(i);else{sel=null;hl.clear();document.getElementById('panel').classList.remove('on');draw()}}pdown=null});
cv.addEventListener('wheel',e=>{e.preventDefault();const z=Math.exp(-e.deltaY*.002);const[wx,wy]=toWorld(e.clientX,e.clientY);scale*=z;ox=e.clientX-wx*scale;oy=e.clientY-wy*scale;draw()},{passive:false});
// pinch
let pt=new Map(),pd0=0;
cv.addEventListener('pointerdown',e=>{pt.set(e.pointerId,e);if(pt.size===2){const a=[...pt.values()];pd0=Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY)}});
cv.addEventListener('pointermove',e=>{if(pt.has(e.pointerId))pt.set(e.pointerId,e);
if(pt.size===2&&pd0){const a=[...pt.values()];const d=Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY);
const f=d/pd0;const cx2=(a[0].clientX+a[1].clientX)/2,cy2=(a[0].clientY+a[1].clientY)/2;const[wx,wy]=toWorld(cx2,cy2);scale*=f;ox=cx2-wx*scale;oy=cy2-wy*scale;pd0=d;draw()}});
cv.addEventListener('pointerup',e=>{pt.delete(e.pointerId);pd0=0});
// search
const q=document.getElementById('q');
q.addEventListener('input',()=>{const f=q.value.toLowerCase();if(!f)return;
const i=N.findIndex(n=>n.label.toLowerCase().includes(f));if(i>=0){jump(N[i].id)}});
addEventListener('resize',()=>{W=innerWidth;H=innerHeight;cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;draw()});
draw();
</script></body></html>
