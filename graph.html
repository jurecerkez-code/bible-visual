<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bible Graph</title><style>
:root{--bg:#0f0d16;--line:#2c2547;--gold:#c9b988;--txt:#e8e2d5;--dim:#9a92b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:Georgia,serif;color:var(--txt)}
#top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:linear-gradient(rgba(15,13,22,.92),rgba(15,13,22,0))}
#top a{color:var(--dim);text-decoration:none;font-size:13px;border:1px solid var(--line);padding:6px 12px;border-radius:16px}
#q{flex:1;background:rgba(26,22,40,.9);border:1px solid var(--line);color:var(--txt);padding:9px 14px;border-radius:18px;font-family:Georgia;font-size:15px;min-width:0}
#cv{position:fixed;inset:0;touch-action:none}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(340px,88vw);background:#141020;border-left:1px solid var(--gold);z-index:30;transform:translateX(105%);transition:.25s;overflow:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
#panel.on{transform:none}
#panel h3{color:var(--gold);font-weight:normal;margin:0 0 4px;font-size:20px;overflow-wrap:anywhere}
#panel .g{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:1px}
#panel .lab{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin:14px 0 4px}
#panel .bk{display:inline-block;background:#1a1628;border:1px solid var(--line);color:#c9b988;border-radius:12px;padding:3px 10px;font-size:12px;margin:0 6px 6px 0;text-decoration:none}
.leg{position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;display:flex;gap:10px;font-size:11px;color:var(--dim)}
.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
#hint{position:fixed;left:12px;top:calc(52px + env(safe-area-inset-top));color:#6d6590;font-size:11px;z-index:20}
</style></head><body>

let pdown=null,moved=false;
cv.addEventListener('pointerdown',e=>{pdown=[e.clientX,e.clientY,ox,oy];moved=false});
cv.addEventListener('pointermove',e=>{if(!pdown)return;const dx=e.clientX-pdown[0],dy=e.clientY-pdown[1];if(Math.abs(dx)+Math.abs(dy)>6)moved=true;if(moved){ox=pdown[2]+dx;oy=pdown[3]+dy;draw()}});
cv.addEventListener('pointerup',e=>{if(pdown&&!moved){const i=hit(e.clientX,e.clientY);if(i!=null)open(i);else{sel=null;hl.clear();document.getElementById('panel').classList.remove('on');draw()}}pdown=null});
cv.addEventListener('wheel',e=>{e.preventDefault();const z=Math.exp(-e.deltaY*.002);const[wx,wy]=toWorld(e.clientX,e.clientY);scale*=z;ox=e.clientX-wx*scale;oy=e.clientY-wy*scale;draw()},{passive:false});
// pinch
let pt=new Map(),pd0=0;
cv.addEventListener('pointerdown',e=>{pt.set(e.pointerId,e);if(pt.size===2){const a=[...pt.values()];pd0=Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY)}});
cv.addEventListener('pointermove',e=>{if(pt.has(e.pointerId))pt.set(e.pointerId,e);
if(pt.size===2&&pd0){const a=[...pt.values()];const d=Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY);
const f=d/pd0;const cx2=(a[0].clientX+a[1].clientX)/2,cy2=(a[0].clientY+a[1].clientY)/2;const[wx,wy]=toWorld(cx2,cy2);scale*=f;ox=cx2-wx*scale;oy=cy2-wy*scale;pd0=d;draw()}});
cv.addEventListener('pointerup',e=>{pt.delete(e.pointerId);pd0=0});
// search
const q=document.getElementById('q');
q.addEventListener('input',()=>{const f=q.value.toLowerCase();if(!f)return;
const i=N.findIndex(n=>n.label.toLowerCase().includes(f));if(i>=0){jump(N[i].id)}});
addEventListener('resize',()=>{W=innerWidth;H=innerHeight;cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;draw()});
</script></body></html>
